[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flexenai"
version = "0.1.0"
description = "Official Python client for the Flexen API (nutrition from text and photos, food search, barcode, goals, catalog, account)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flexen UG (haftungsbeschränkt)", email = "support@flexen.co" }]
keywords = ["flexen", "nutrition", "calories", "food", "barcode", "api", "sdk"]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://flexen.co/developers"
Repository = "https://github.com/FlexenApp/flexen-sdks"
Changelog = "https://github.com/FlexenApp/flexen-sdks/blob/main/packages/python/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/flexenai"]

[tool.hatch.build.targets.sdist]
include = ["src/flexenai", "README.md", "README.de.md", "CHANGELOG.md", "LICENSE", "examples"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
