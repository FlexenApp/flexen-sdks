name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          python -m venv packages/python/.venv
          packages/python/.venv/bin/pip install -r packages/python/requirements-dev.lock
      - run: npm run test:scripts
      # No website checkout in CI: the contract step is skipped, codegen, ts and python are checked.
      - run: npm run check:contract -- --offline
      - run: npm run test:ts
      - run: npm run test:python
      - run: npm run build:ts
