# Publishes one SDK per tag, with trusted publishing (OIDC). No tokens are stored in this repository.
#
#   ts-v0.1.0  -> @flexenai/api on npm   (provenance)
#   py-v0.1.0  -> flexenai on PyPI     (attestations)
#
# Before the first run, see RELEASING.md: the trusted publishers must be registered on npmjs.com and pypi.org
# with exactly this repository, this file name (publish.yml) and the environments npm and pypi.
# workflow_dispatch builds and checks everything but publishes nothing.
name: publish
on:
  push:
    tags: ['ts-v*', 'py-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          python -m venv packages/python/.venv
          packages/python/.venv/bin/pip install -r packages/python/requirements-dev.lock
      - run: npm run test:scripts
      - run: npm run check:contract -- --offline
      - run: npm run test:ts
      - run: npm run test:python
      - name: The tag must match the version in the package
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-version.mjs "${GITHUB_REF_NAME}"

  npm:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build:ts
      - run: npm stage publish -w @flexenai/api --access public --provenance

  pypi:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.2.2
      - run: python -m build packages/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
